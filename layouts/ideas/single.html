{{ define "main" }}
<article style="max-width:720px;margin:0 auto;padding:48px 0">
  <header style="margin-bottom:36px">
    {{ with .Params.news_source }}
    <div style="font-size:0.8125rem;color:var(--accent);margin-bottom:12px;font-weight:600">
      📰 来源：{{ . }}
    </div>
    {{ end }}
    <h1 style="font-size:1.5rem;color:var(--text-1);line-height:1.5;margin:0 0 8px">{{ .Title }}</h1>
    <time style="font-size:0.8125rem;color:var(--text-4)">{{ .Date.Format "2006年01月02日" }}</time>
  </header>

  <div class="content" style="font-size:0.9375rem;color:var(--text-2);line-height:1.9">
    {{ .Content }}
  </div>

  <nav style="margin-top:48px;padding-top:24px;border-top:1px solid var(--border-2);display:flex;justify-content:space-between">
    <a href="/ideas/" style="color:var(--accent);text-decoration:none;font-weight:600;font-size:0.875rem">← 有趣点子列表</a>
    <a href="/" style="color:var(--text-4);text-decoration:none;font-size:0.875rem">AI Know 首页</a>
  </nav>
</article>

<script src="/assets/js/tts-player.js"></script>

<style>
  .content h2 { font-size:1.125rem;color:var(--text-1);margin:28px 0 12px;font-weight:700 }
  .content h3 { font-size:1rem;color:var(--text-1);margin:20px 0 8px }
  .content p { margin:0 0 12px }
  .content a { color:var(--accent);text-decoration:underline }
  .content ul, .content ol { margin:8px 0 16px;padding-left:20px }
  .content li { margin-bottom:4px }
  .content code { background:var(--surface-2);padding:2px 6px;border-radius:4px;font-size:0.85em }
  .content blockquote { border-left:3px solid var(--accent);margin:16px 0;padding:8px 16px;color:var(--text-3);font-size:0.875rem }
</style>
{{ end }}
