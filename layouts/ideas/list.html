{{ define "main" }}
<div class="section-header" style="text-align:center;padding:48px 0 24px">
  <h1>{{ .Title }}</h1>
  {{ with .Params.description }}<p style="color:var(--text-3);margin-top:8px;font-size:0.9375rem">{{ . }}</p>{{ end }}
  <p style="color:var(--text-4);font-size:0.8125rem;margin-top:4px">共 {{ len .Pages }} 篇</p>
</div>

<div class="list" style="margin-top:24px">
  {{ range .Pages.ByDate.Reverse }}
  <a href="/ideas/{{ .Date.Format "2006-01-02" }}.html" class="card" style="display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border-2);text-decoration:none;color:var(--text-1);transition:background 0.15s">
    <span class="date" style="font-weight:700;font-size:0.875rem;min-width:52px;color:var(--text-3);white-space:nowrap">{{ .Date.Format "01-02" }}</span>
    <span class="summary" style="flex:1;font-size:0.9375rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">
      {{ with .Params.tagline }}{{ . }}{{ else }}{{ .Title }}{{ end }}
    </span>
    <span class="arrow" style="color:var(--text-4);flex-shrink:0">→</span>
  </a>
  {{ end }}
</div>
{{ end }}
