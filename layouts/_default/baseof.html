<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  {{ partial "head.html" . }}
  <style>
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 52px 200px minmax(0,1fr) !important; }
      .app-sidebar { width: 52px !important; padding: 12px 8px !important; }
      .sidebar-label, .sidebar-logo-hot, .sidebar-logo-orbit { display: none !important; }
      .sidebar-logo { justify-content: center !important; }
      .sidebar-link { justify-content: center !important; padding: 10px 0 !important; }
      .sidebar-icon { margin: 0 !important; }
    }
    @media (max-width: 640px) {
      .app-shell { grid-template-columns: 1fr !important; }
      .app-sidebar {
        position: fixed !important;
        top: 0; left: 0;
        width: 240px !important;
        height: 100vh;
        z-index: 200;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        padding: 20px 16px !important;
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      .app-sidebar.sidebar--open { transform: translateX(0); }
      .sidebar-label { display: inline !important; }
      .sidebar-logo-hot, .sidebar-logo-orbit { display: inline-flex !important; }
      .sidebar-link { justify-content: flex-start !important; }
      .sidebar-icon { margin: 0 4px 0 0 !important; }

      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 199;
        backdrop-filter: blur(2px);
      }
      .sidebar-backdrop--visible { display: block; }

      .sidebar-toggle {
        display: flex !important;
        position: fixed;
        top: 8px; left: 8px;
        z-index: 150;
        width: 36px; height: 36px;
        align-items: center; justify-content: center;
        background: var(--pm-surface-container);
        border: var(--pm-border-thin);
        border-radius: 8px;
        cursor: pointer;
        color: var(--pm-text-primary);
      }

      .app-middle { display: none !important; }
      .app-main { padding-top: 52px !important; }
    }
  </style>
  <script>
    function toggleSidebar() {
      var sb = document.querySelector('.app-sidebar');
      var bd = document.querySelector('.sidebar-backdrop');
      var open = sb.classList.toggle('sidebar--open');
      bd.classList.toggle('sidebar-backdrop--visible', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }
    function closeSidebar() {
      var sb = document.querySelector('.app-sidebar');
      var bd = document.querySelector('.sidebar-backdrop');
      sb.classList.remove('sidebar--open');
      bd.classList.remove('sidebar-backdrop--visible');
      document.body.style.overflow = '';
    }
    // Close sidebar when clicking a sidebar link on mobile
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.app-sidebar .sidebar-link').forEach(function(link) {
        link.addEventListener('click', function() {
          if (window.innerWidth <= 640) closeSidebar();
        });
      });
    });
  </script>
</head>
<body>
  <!-- Mobile: hamburger toggle -->
  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="菜单" style="display:none">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Mobile: backdrop overlay -->
  <div class="sidebar-backdrop" onclick="closeSidebar()"></div>

  <div class="app-shell">
    <!-- 左栏：一级菜单 -->
    {{ partial "sidebar.html" . }}

    <!-- 中栏：栏目文章列表 -->
    <div class="app-middle">
      <div class="middle-header">{{ block "middle_title" . }}{{ .Title }}{{ end }}</div>
      <nav class="middle-list">
        {{ block "middle" . }}{{ end }}
      </nav>
    </div>

    <!-- 右栏：文章详细内容 -->
    <main class="app-main">
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  {{ partial "footer.html" . }}
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/tts-player.js"></script>
</body>
</html>
