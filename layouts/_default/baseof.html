<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  {{ partial "head.html" . }}
  <style>
    /* ── Mobile Responsive ── */
    @media (max-width: 768px) {
      main.container { max-width: 100% !important; padding: 0 12px 40px !important; }
      h1 { font-size: 1.4em !important; }
      .card { flex-direction: column; align-items: flex-start; gap: 6px; }
      .card .arrow { display: none; }
      .card .date { min-width: 0; }
      .site-nav { padding: 10px 16px; }
      .site-nav-links { gap: 4px; }
      .site-nav-links a { font-size: 13px; padding: 4px 10px; }
      .site-nav-cta { font-size: 0.8em; padding: 4px 10px; }
    }
    @media (max-width: 480px) {
      main.container { padding: 0 8px 32px !important; }
      h1 { font-size: 1.2em !important; }
      .site-nav { padding: 8px 12px; }
      .site-nav-links { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
      .site-nav-links a { font-size: 12px; padding: 4px 8px; }
      .site-nav-cta { font-size: 0.75em; padding: 4px 8px; }
    }
  </style>
</head>
<body>
  {{ partial "nav.html" . }}
  <main class="container" style="max-width:860px;margin:0 auto;padding:0 20px 40px">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/mobile-nav.js"></script>
</body>
</html>
