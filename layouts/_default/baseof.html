<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>{{ partial "head.html" . }}</head>
<body>
<div class="app-shell">
  <aside id="app-sidebar" class="app-sidebar" aria-label="主导航">
    <button type="button" class="sidebar-close" onclick="document.getElementById('app-sidebar').classList.remove('open')" aria-label="关闭导航">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="sidebar-brand"><a href="/" class="sidebar-logo"><span class="sidebar-logo-ai">AI</span><span class="sidebar-logo-orbit"><span class="sidebar-logo-core"></span></span><span class="sidebar-logo-hot">Know</span></a></div>
    <div class="sidebar-divider"></div>
    <nav class="sidebar-nav">
      <a href="/" class="sidebar-link{{ if .IsHome }} sidebar-link--active{{ end }}"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span class="sidebar-label">精选首页</span></a>
      <a href="/daily/ai-morning/" class="sidebar-link{{ if hasPrefix .RelPermalink "/daily/ai-morning" }} sidebar-link--active{{ end }}"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h13a2 2 0 0 1 2 2v13a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2h1"/><path d="M6 7h10"/><path d="M6 11h10"/><path d="M6 15h7"/></svg><span class="sidebar-label">AI 早报</span></a>
      <a href="/daily/ai-tech/" class="sidebar-link{{ if hasPrefix .RelPermalink "/daily/ai-tech" }} sidebar-link--active{{ end }}"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span class="sidebar-label">AI 技术</span></a>
      <a href="/daily/ai-finance/" class="sidebar-link{{ if hasPrefix .RelPermalink "/daily/ai-finance" }} sidebar-link--active{{ end }}"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="sidebar-label">AI 财经</span></a>
      <a href="/hardware/" class="sidebar-link{{ if hasPrefix .RelPermalink "/hardware" }} sidebar-link--active{{ end }}"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span class="sidebar-label">硬件编程</span></a>
      <a href="/ideas/" class="sidebar-link{{ if hasPrefix .RelPermalink "/ideas" }} sidebar-link--active{{ end }}"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="sidebar-label">有趣点子</span></a>
      <a href="/aieng/" class="sidebar-link{{ if hasPrefix .RelPermalink "/aieng" }} sidebar-link--active{{ end }}"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><span class="sidebar-label">AI 工程</span></a>
      <a href="/easyvibe/" class="sidebar-link{{ if hasPrefix .RelPermalink "/easyvibe" }} sidebar-link--active{{ end }}"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><span class="sidebar-label">Vibe 编程</span></a>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
      <a href="/kb/write.html" class="sidebar-link"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="sidebar-label">AI 论坛</span></a>
      <a href="/kb/" class="sidebar-link"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="sidebar-label">AI 搜索</span></a>
      <button class="sidebar-theme-toggle" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'"><svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><span class="sidebar-label">主题切换</span></button>
    </div>
  </aside>

  <div class="app-middle">
    <div class="middle-header">{{ template "middle_title" . }}</div>
    <nav class="middle-list">{{ template "middle" . }}</nav>
  </div>

  <main class="app-main">
    <div class="app-mobile-bar">
      <button type="button" class="app-hamburger" onclick="document.getElementById('app-sidebar').classList.add('open')" aria-label="打开导航">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="app-mobile-title">{{ template "middle_title" . }}</span>
    </div>
    {{ block "main" . }}{{ end }}
  </main>
</div>
{{ partial "footer.html" . }}
<script src="/assets/js/theme.js"></script>
<script>
// Close sidebar when clicking backdrop on mobile
document.getElementById('app-sidebar').addEventListener('click', function(e){
  if (e.target === this) this.classList.remove('open');
});
// Close sidebar when clicking a link
document.querySelectorAll('#app-sidebar .sidebar-link').forEach(function(l){
  l.addEventListener('click', function(){ document.getElementById('app-sidebar').classList.remove('open'); });
});
</script>
</body>
</html>
