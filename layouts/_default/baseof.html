<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  {{ partial "head.html" . }}
  <style>
    /* ─── Mobile Responsive ─── */
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 52px minmax(0,1fr) !important; }
      .app-sidebar { width: 52px !important; padding: 12px 8px !important; }
      .sidebar-label, .sidebar-logo-hot, .sidebar-brand { display: none !important; }
      .sidebar-logo { justify-content: center !important; }
      .sidebar-link { justify-content: center !important; padding: 8px 0 !important; }
      .sidebar-icon { margin: 0 !important; }

      .app-middle { display: none !important; }
    }
    @media (max-width: 640px) {
      .app-shell { grid-template-columns: 1fr !important; }
      .app-sidebar { display: none !important; }
      .app-middle { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 左栏：一级菜单 -->
    {{ partial "sidebar.html" . }}

    <!-- 中栏：二级筛选 -->
    <div class="app-middle">
      <div class="middle-title">筛选</div>
      <nav class="middle-nav">
        {{ block "middle" . }}
        <a href="/" class="middle-link{{ if .IsHome }} middle-link--active{{ end }}">全部</a>
        <a href="/daily/ai-morning/" class="middle-link{{ if hasPrefix .RelPermalink "/daily/ai-morning" }} middle-link--active{{ end }}">早报</a>
        <a href="/daily/ai-tech/" class="middle-link{{ if hasPrefix .RelPermalink "/daily/ai-tech" }} middle-link--active{{ end }}">AI技术</a>
        <a href="/daily/ai-finance/" class="middle-link{{ if hasPrefix .RelPermalink "/daily/ai-finance" }} middle-link--active{{ end }}">AI财经</a>
        <a href="/hardware/" class="middle-link{{ if hasPrefix .RelPermalink "/hardware" }} middle-link--active{{ end }}">硬件</a>
        <a href="/ideas/" class="middle-link{{ if hasPrefix .RelPermalink "/ideas" }} middle-link--active{{ end }}">点子</a>
        {{ end }}
      </nav>
    </div>

    <!-- 右栏：详细内容 -->
    <main class="app-main">
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  {{ partial "footer.html" . }}
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/tts-player.js"></script>
</body>
</html>
