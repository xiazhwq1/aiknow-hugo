<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  {{ partial "head.html" . }}
  <style>
    /* ── Mobile Responsive (List Pages Optimized) ── */
    @media (max-width: 768px) {
      /* Container */
      main.container { max-width: 100% !important; padding: 0 14px 40px !important; }

      /* Section header — more compact */
      .section-header { padding: 28px 0 16px !important; }
      h1 { font-size: 1.35em !important; }
      .section-header p { font-size: 0.85rem; margin-top: 4px !important; }

      /* Cards — card-style with background, not just border-bottom */
      .card {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 4px !important;
        padding: 14px 16px !important;
        margin-bottom: 6px;
        border-radius: 10px !important;
        background: var(--surface-1, rgba(128,128,128,0.03));
        border: 1px solid var(--border-card, rgba(128,128,128,0.08)) !important;
        border-bottom: 1px solid var(--border-card, rgba(128,128,128,0.08)) !important;
      }
      .card:active {
        background: var(--surface-2, rgba(37,99,235,0.04)) !important;
        border-color: var(--accent, rgba(37,99,235,0.2)) !important;
      }
      .card .arrow { display: none; }
      .card .date {
        min-width: 0 !important;
        font-size: 0.75rem !important;
        color: var(--accent, #2563eb) !important;
        font-weight: 600 !important;
      }
      /* Summary — wrap to 2 lines instead of ellipsis */
      .card .summary {
        white-space: normal !important;
        font-size: 0.85rem !important;
        line-height: 1.45 !important;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        color: var(--text-1);
      }

      /* List spacing */
      .list { margin-top: 12px !important; }

      /* Nav */
      .site-nav { padding: 8px 14px; gap: 4px; }
      .site-nav-links { gap: 3px; }
      .site-nav-links a { font-size: 12px; padding: 4px 8px; }
      .site-nav-cta { font-size: 0.75em; padding: 4px 8px; }
    }

    @media (max-width: 480px) {
      main.container { padding: 0 10px 32px !important; }
      h1 { font-size: 1.15em !important; }
      .section-header { padding: 22px 0 12px !important; }

      .card {
        padding: 12px 14px !important;
        margin-bottom: 5px;
        border-radius: 8px !important;
      }
      .card .summary {
        font-size: 0.8rem !important;
        -webkit-line-clamp: 3;
      }
      .card .date { font-size: 0.7rem !important; }

      /* Nav — tighter for smallest screens */
      .site-nav { padding: 6px 8px; gap: 2px; }
      .site-nav-links { gap: 1px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
      .site-nav-links a { font-size: 11px; padding: 3px 6px; }
      .site-nav-logo img { width: 22px; height: 22px; }
      .site-nav-logo span { font-size: 0.8rem !important; display: inline !important; }
      .site-nav-ctas { gap: 3px; }
      .site-nav-cta { font-size: 0.7em; padding: 3px 6px; }
    }
  </style>
</head>
<body>
  {{ partial "nav.html" . }}
  <main class="container" style="max-width:860px;margin:0 auto;padding:0 20px 40px">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/tts-player.js"></script>
</body>
</html>
