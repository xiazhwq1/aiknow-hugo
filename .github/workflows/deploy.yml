name: Build & Deploy

# 定时触发已关闭。这套 Hugo 站点的 content 最后更新于 2026-07-01，而线上没有任何一个
# 页面还是 Hugo 产的 —— 日报四栏、首页、搜索页全部由服务器上的规范管线每天生成。
# 保留定时部署的唯一效果，是每天 06:30 把 Hugo 的 static/（site-nav.css、theme.js、
# search/index.html…）覆盖到规范产物上：2026-08-20 首页的主题切换按钮变回两个、
# 08-19 首页导航被整块换掉触发发布闸门 panel-count，都是这么来的。
#
# 需要发布 Hugo 内容时手动触发即可。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify --buildFuture

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          cd public
          tar czf /tmp/hugo_build.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/hugo_build.tar.gz ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/
          # 解压到独立目录, 不再直接盖在规范管线的工作目录上 ——
          # 两条管线共用一个输出目录, 后跑的那条就会把先跑的成果抹掉。
          ssh -i ~/.ssh/deploy_key ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} 'mkdir -p /home/admin/hugo-staging && cd /home/admin/hugo-staging && tar xzf /tmp/hugo_build.tar.gz && rm /tmp/hugo_build.tar.gz && echo "deployed to /home/admin/hugo-staging (not live)"'
