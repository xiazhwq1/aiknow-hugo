name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          cd public
          tar czf /tmp/hugo_build.tar.gz .
          scp -i ~/.ssh/deploy_key /tmp/hugo_build.tar.gz ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} 'mkdir -p /home/admin/.openclaw/workspace/xiaoao && cd /home/admin/.openclaw/workspace/xiaoao && tar xzf /tmp/hugo_build.tar.gz && rm /tmp/hugo_build.tar.gz && echo deployed'
