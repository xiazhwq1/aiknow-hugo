name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "echo OK"

      - name: Deploy via rsync
        run: rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30" public/ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/var/www/xiaoao/
